spring.application.name=board
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.config.import=optional:file:.env[.properties]
spring.data.mongodb.uri=${MONGODB_URL}
spring.security.oauth2.client.registration.google.provider=google
spring.security.oauth2.client.registration.google.client-id=${CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${CLIENT_SECRET}
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.redirect-uri=${REDIRECT_URI}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.provider.google.issuer-uri=https://accounts.google.com
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=0
debug=true
app.version=1.0.0
# Ruta de la documentación OpenAPI (JSON)
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true

# Ruta de la UI de Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# IMPORTANTE: Configurar la URL correctamente
# Usar ruta relativa para evitar problemas de CORS
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config

# Ordenar alfabéticamente
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Habilitar filtro de búsqueda
springdoc.swagger-ui.filter=true

# Mostrar duración de requests
springdoc.swagger-ui.display-request-duration=true

# Expansión de modelos
springdoc.swagger-ui.default-models-expand-depth=1
springdoc.swagger-ui.default-model-expand-depth=1
springdoc.swagger-ui.doc-expansion=none

# Intentar una operación por defecto
springdoc.swagger-ui.try-it-out-enabled=true

# Deshabilitar validación de esquema (puede causar problemas)
springdoc.swagger-ui.disable-swagger-default-url=true

# Mostrar la barra de peticiones
springdoc.swagger-ui.display-operation-id=false

# Cache
springdoc.cache.disabled=true

# ============================================
# Spring MVC Configuration
# ============================================
# Asegurar que las excepciones se lancen correctamente
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true
