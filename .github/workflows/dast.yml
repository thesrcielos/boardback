name: DAST Security Scan (OWASP ZAP)

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  zap_authenticated_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Authenticate and obtain JWT
        id: auth
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://boardback-ergfg6cxfudshkbz.canadacentral-01.azurewebsites.net/api/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${{ secrets.ZAP_EMAIL }}\", \"password\":\"${{ secrets.ZAP_PASSWORD }}\"}")

          TOKEN=$(echo "$RESPONSE" | jq -r '.token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" == "null" ]; then
            echo "Error: Could not retrieve token"
            exit 1
          fi

          echo "TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Create headers.context
        run: |
          cat <<EOF > headers.context
          [{
            "name": "Authorization",
            "value": "Bearer ${TOKEN}",
            "enabled": true
          }]
          EOF

          echo "Generated headers.context:"
          cat headers.context

      - name: ZAP Authenticated Full Scan
        uses: zaproxy/action-full-scan@v0.7.0
        with:
          target: "https://boardback-ergfg6cxfudshkbz.canadacentral-01.azurewebsites.net/"
          cmd_options: >
            -a
            -config httpsender.default.headersFile=/zap/wrk/headers.context
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ZAP Reports
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-report
          path: |
            zap_report.html
            zap_report.md
            zap_report.json
          if-no-files-found: warn

      - name: Fail if High Alerts
        run: |
          if grep -q "High" zap_report.md; then
            echo "❌ High severity vulnerabilities found!"
            exit 1
          else
            echo "✔ No high vulnerabilities."
          fi
