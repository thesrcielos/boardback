name: DAST Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  TARGET_URL: ${{ secrets.TARGET_URL }}
  API_EMAIL: ${{ secrets.ZAP_EMAIL }}
  API_PASSWORD: ${{ secrets.ZAP_PASSWORD }}

jobs:
  dast-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Obtener JWT Token
        id: get-jwt
        run: |
          # Realizar login y obtener JWT
          RESPONSE=$(curl -s -X POST "${{ env.TARGET_URL }}/api/auth/login" \
            -H "Content-Type: application/json" \
            -d '{
              "email": "${{ env.API_EMAIL }}",
              "password": "${{ env.API_PASSWORD }}"
            }')
          
          # Extraer el token JWT de la respuesta
          JWT_TOKEN=$(echo $RESPONSE | jq -r '.token // .access_token // .jwt')
          
          if [ -z "$JWT_TOKEN" ] || [ "$JWT_TOKEN" = "null" ]; then
            echo "Error: No se pudo obtener el JWT token"
            exit 1
          fi
          
          echo "::add-mask::$JWT_TOKEN"
          echo "jwt_token=$JWT_TOKEN" >> $GITHUB_OUTPUT

      - name: DAST con OWASP ZAP
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ env.TARGET_URL }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j -config replacer.full_list(0).description=auth1 -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Authorization -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement="Bearer ${{ steps.get-jwt.outputs.jwt_token }}"'

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html

      - name: Crear Issue si hay vulnerabilidades críticas
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Vulnerabilidades detectadas en DAST Scan',
              body: 'Se han detectado vulnerabilidades en el análisis DAST. Revisa el reporte en los artifacts del workflow.',
              labels: ['security', 'dast']
            })
