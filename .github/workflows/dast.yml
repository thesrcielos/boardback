name: DAST Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1' # Ejecutar cada lunes a las 2 AM
  workflow_dispatch: # Permite ejecución manual

env:
  TARGET_URL: ${{ secrets.TARGET_URL }}
  API_USERNAME: ${{ secrets.ZAP_EMAIL }}
  API_PASSWORD: ${{ secrets.ZAP_PASSWORD }}

jobs:
  dast-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Obtener JWT Token
        id: get-jwt
        run: |
          # Realizar login y obtener JWT
          RESPONSE=$(curl -s -X POST "${{ env.TARGET_URL }}/api/auth/login" \
            -H "Content-Type: application/json" \
            -d '{
              "email": "${{ env.API_USERNAME }}",
              "password": "${{ env.API_PASSWORD }}"
            }')
          
          # Extraer el token JWT de la respuesta
          JWT_TOKEN=$(echo $RESPONSE | jq -r '.token // .access_token // .jwt')
          
          if [ -z "$JWT_TOKEN" ] || [ "$JWT_TOKEN" = "null" ]; then
            echo "Error: No se pudo obtener el JWT token"
            exit 1
          fi
          
          echo "::add-mask::$JWT_TOKEN"
          echo "jwt_token=$JWT_TOKEN" >> $GITHUB_OUTPUT

      - name: Crear directorio ZAP
        run: mkdir -p .zap

      - name: Crear archivo de configuración ZAP
        run: |
          cat > .zap/context.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <configuration>
            <context>
              <name>Default Context</name>
              <desc/>
              <inscope>true</inscope>
              <incregexes>${{ env.TARGET_URL }}.*</incregexes>
              <tech>
                <include>Db</include>
                <include>OS</include>
                <include>Language</include>
              </tech>
              <urlparser>
                <class>org.zaproxy.zap.model.StandardParameterParser</class>
                <config>{"kvps":"&amp;","kvs":"=","struct":[]}</config>
              </urlparser>
              <postparser>
                <class>org.zaproxy.zap.model.StandardParameterParser</class>
                <config>{"kvps":"&amp;","kvs":"=","struct":[]}</config>
              </postparser>
              <authentication>
                <type>0</type>
                <strategy>EACH_RESP</strategy>
                <pollurl/>
                <polldata/>
                <pollheaders/>
                <pollfreq>60</pollfreq>
                <pollunits>REQUESTS</pollunits>
              </authentication>
              <forceduser>-1</forceduser>
              <session>
                <type>0</type>
              </session>
              <authorization>
                <type>0</type>
                <basic>
                  <header/>
                  <body/>
                  <logic>AND</logic>
                  <code>-1</code>
                </basic>
              </authorization>
            </context>
          </configuration>
          EOF

      - name: DAST con OWASP ZAP
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ env.TARGET_URL }}
          cmd_options: '-a -j'
        env:
          ZAP_AUTH_HEADER: Authorization
          ZAP_AUTH_HEADER_VALUE: Bearer ${{ steps.get-jwt.outputs.jwt_token }}

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html

      - name: Crear Issue si hay vulnerabilidades críticas
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Vulnerabilidades detectadas en DAST Scan',
              body: 'Se han detectado vulnerabilidades en el análisis DAST. Revisa el reporte en los artifacts del workflow.',
              labels: ['security', 'dast']
            })

      # Alternativa: DAST con Nuclei
      - name: Setup Nuclei
        if: false # Cambia a true si prefieres usar Nuclei
        run: |
          wget -q https://github.com/projectdiscovery/nuclei/releases/latest/download/nuclei_linux_amd64.zip
          unzip -q nuclei_linux_amd64.zip
          sudo mv nuclei /usr/local/bin/
          nuclei -update-templates

      - name: Run Nuclei Scan
        if: false # Cambia a true si prefieres usar Nuclei
        run: |
          nuclei -target ${{ env.TARGET_URL }} \
            -header "Authorization: Bearer ${{ steps.get-jwt.outputs.jwt_token }}" \
            -severity critical,high,medium \
            -json -o nuclei-results.json

      - name: Upload Nuclei Results
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-results
          path: nuclei-results.json