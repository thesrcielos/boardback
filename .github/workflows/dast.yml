name: DAST Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  TARGET_URL: ${{ secrets.TARGET_URL }}
  API_USERNAME: ${{ secrets.ZAP_EMAIL }}
  API_PASSWORD: ${{ secrets.ZAP_PASSWORD }}

jobs:
  dast-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Obtener JWT Token
        id: get-jwt
        run: |
          # Realizar login y obtener JWT
          RESPONSE=$(curl -s -X POST "${{ env.TARGET_URL }}/api/auth/login" \
            -H "Content-Type: application/json" \
            -d '{
              "email": "${{ env.API_USERNAME }}",
              "password": "${{ env.API_PASSWORD }}"
            }')
          
          # Extraer el token JWT de la respuesta
          JWT_TOKEN=$(echo $RESPONSE | jq -r '.token // .access_token // .jwt')
          
          if [ -z "$JWT_TOKEN" ] || [ "$JWT_TOKEN" = "null" ]; then
            echo "Error: No se pudo obtener el JWT token"
            exit 1
          fi
          
          echo "::add-mask::$JWT_TOKEN"
          echo "jwt_token=$JWT_TOKEN" >> $GITHUB_OUTPUT

      - name: Crear directorio ZAP
        run: mkdir -p .zap

      - name: Crear archivo de configuración ZAP
        run: |
          cat > .zap/context.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <configuration>
            <context>
              <name>Default Context</name>
              <desc/>
              <inscope>true</inscope>
              <incregexes>${{ env.TARGET_URL }}.*</incregexes>
              <tech>
                <include>Db</include>
                <include>OS</include>
                <include>Language</include>
              </tech>
              <urlparser>
                <class>org.zaproxy.zap.model.StandardParameterParser</class>
                <config>{"kvps":"&amp;","kvs":"=","struct":[]}</config>
              </urlparser>
              <postparser>
                <class>org.zaproxy.zap.model.StandardParameterParser</class>
                <config>{"kvps":"&amp;","kvs":"=","struct":[]}</config>
              </postparser>
              <authentication>
                <type>0</type>
                <strategy>EACH_RESP</strategy>
                <pollurl/>
                <polldata/>
                <pollheaders/>
                <pollfreq>60</pollfreq>
                <pollunits>REQUESTS</pollunits>
              </authentication>
              <forceduser>-1</forceduser>
              <session>
                <type>0</type>
              </session>
              <authorization>
                <type>0</type>
                <basic>
                  <header/>
                  <body/>
                  <logic>AND</logic>
                  <code>-1</code>
                </basic>
              </authorization>
            </context>
          </configuration>
          EOF

      - name: DAST con OWASP ZAP
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ env.TARGET_URL }}
          cmd_options: '-a -j -I'
        env:
          ZAP_AUTH_HEADER: Authorization
          ZAP_AUTH_HEADER_VALUE: Bearer ${{ steps.get-jwt.outputs.jwt_token }}
        continue-on-error: true

      - name: Analizar resultados del escaneo
        if: always()
        run: |
          if [ -f report_json.json ]; then
            echo "### 📊 Resumen del escaneo DAST" >> $GITHUB_STEP_SUMMARY
          
            # Contar alertas por severidad
            HIGH=$(jq '[.site[].alerts[] | select(.riskcode == "3")] | length' report_json.json)
            MEDIUM=$(jq '[.site[].alerts[] | select(.riskcode == "2")] | length' report_json.json)
            LOW=$(jq '[.site[].alerts[] | select(.riskcode == "1")] | length' report_json.json)
            INFO=$(jq '[.site[].alerts[] | select(.riskcode == "0")] | length' report_json.json)
          
            echo "- 🔴 **High**: $HIGH" >> $GITHUB_STEP_SUMMARY
            echo "- 🟠 **Medium**: $MEDIUM" >> $GITHUB_STEP_SUMMARY
            echo "- 🟡 **Low**: $LOW" >> $GITHUB_STEP_SUMMARY
            echo "- 🔵 **Info**: $INFO" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          
            # Fallar si hay vulnerabilidades críticas o altas
            if [ "$HIGH" -gt "0" ]; then
              echo "❌ Se encontraron vulnerabilidades de severidad ALTA" >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
          else
            echo "⚠️ No se generó el reporte JSON" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload ZAP Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-security-report
          path: |
            report_html.html
            report_json.json
            report_md.md

      - name: Crear Issue si hay vulnerabilidades críticas
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let alertsBody = '### 🔍 Vulnerabilidades detectadas en DAST Scan\n\n';
            
            try {
              const report = JSON.parse(fs.readFileSync('report_json.json', 'utf8'));
            
              // Filtrar alertas de alta severidad
              const highAlerts = [];
              report.site.forEach(site => {
                site.alerts.forEach(alert => {
                  if (alert.riskcode === "3" || alert.riskcode === "2") {
                    highAlerts.push(alert);
                  }
                });
              });
            
              if (highAlerts.length > 0) {
                alertsBody += '#### Vulnerabilidades encontradas:\n\n';
                highAlerts.forEach(alert => {
                  const severity = alert.riskcode === "3" ? "🔴 HIGH" : "🟠 MEDIUM";
                  alertsBody += `**${severity}**: ${alert.name}\n`;
                  alertsBody += `- **Descripción**: ${alert.desc.substring(0, 200)}...\n`;
                  alertsBody += `- **Solución**: ${alert.solution.substring(0, 200)}...\n\n`;
                });
              }
            } catch (error) {
              alertsBody += 'No se pudo parsear el reporte. Revisa los artifacts para más detalles.\n';
            }
            
            alertsBody += '\n---\n';
            alertsBody += `**Run ID**: ${context.runId}\n`;
            alertsBody += `**Commit**: ${context.sha.substring(0, 7)}\n`;
            alertsBody += `[Ver reporte completo](${context.payload.repository.html_url}/actions/runs/${context.runId})`;
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Vulnerabilidades de seguridad detectadas - ${new Date().toISOString().split('T')[0]}`,
              body: alertsBody,
              labels: ['security', 'dast', 'vulnerability']
            });

      # Alternativa: DAST con Nuclei
      - name: Setup Nuclei
        if: false # Cambia a true si prefieres usar Nuclei
        run: |
          wget -q https://github.com/projectdiscovery/nuclei/releases/latest/download/nuclei_linux_amd64.zip
          unzip -q nuclei_linux_amd64.zip
          sudo mv nuclei /usr/local/bin/
          nuclei -update-templates

      - name: Run Nuclei Scan
        if: false # Cambia a true si prefieres usar Nuclei
        run: |
          nuclei -target ${{ env.TARGET_URL }} \
            -header "Authorization: Bearer ${{ steps.get-jwt.outputs.jwt_token }}" \
            -severity critical,high,medium \
            -json -o nuclei-results.json

      - name: Upload Nuclei Results
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-results
          path: nuclei-results.json